name: Test Setup Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js and sudo (for actions and setup)
        run: |
          if ! command -v node &>/dev/null; then
            apt-get update && apt-get install -y nodejs
          fi
          if ! command -v sudo &>/dev/null; then
            apt-get install -y sudo
          fi
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Run setup
        run: bash setup.sh

      - name: Verify setup - directories exist
        run: |
          test -d "$HOME/.config/R"    || { echo "FAIL: ~/.config/R missing"; exit 1; }
          test -d "$HOME/.vscode-R"    || { echo "FAIL: ~/.vscode-R missing"; exit 1; }

      - name: Verify setup - .Rprofile symlink
        run: |
          test -L "$HOME/.config/R/.Rprofile" || { echo "FAIL: ~/.config/R/.Rprofile symlink missing"; exit 1; }
          LINK_TARGET="$(readlink "$HOME/.config/R/.Rprofile")"
          echo "Symlink target: $LINK_TARGET"

      - name: Verify setup - ~/.Renviron entries
        run: |
          grep -q "^R_LIBS_USER="    "$HOME/.Renviron" || { echo "FAIL: R_LIBS_USER missing from ~/.Renviron"; exit 1; }
          grep -q "^R_LIBS_SITE="    "$HOME/.Renviron" || { echo "FAIL: R_LIBS_SITE missing from ~/.Renviron"; exit 1; }
          grep -q "^R_PROFILE_USER=" "$HOME/.Renviron" || { echo "FAIL: R_PROFILE_USER missing from ~/.Renviron"; exit 1; }
          cat "$HOME/.Renviron"

      - name: Run uninstall
        run: bash uninstall.sh

      - name: Verify uninstall - directories removed
        run: |
          test ! -d "$HOME/.config/R" || { echo "FAIL: ~/.config/R still exists"; exit 1; }
          test ! -d "$HOME/.vscode-R" || { echo "FAIL: ~/.vscode-R still exists"; exit 1; }

      - name: Verify uninstall - ~/.Renviron cleaned
        run: |
          if [ -f "$HOME/.Renviron" ]; then
            grep -q "^R_LIBS_USER="    "$HOME/.Renviron" && { echo "FAIL: R_LIBS_USER still in ~/.Renviron"; exit 1; } || true
            grep -q "^R_LIBS_SITE="    "$HOME/.Renviron" && { echo "FAIL: R_LIBS_SITE still in ~/.Renviron"; exit 1; } || true
            grep -q "^R_PROFILE_USER=" "$HOME/.Renviron" && { echo "FAIL: R_PROFILE_USER still in ~/.Renviron"; exit 1; } || true
          fi

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Chocolatey installs R to C:\Program Files\R\R-X.Y.Z, which matches Get-RPath detection
      - name: Install R
        run: choco install r.project --yes --no-progress
        shell: powershell

      - name: Run setup
        run: .\setup.ps1
        shell: pwsh

      - name: Verify setup - directories exist
        shell: pwsh
        run: |
          if (-not (Test-Path "$HOME\.config\R"))                          { Write-Error "FAIL: ~/.config/R missing"; exit 1 }
          if (-not (Test-Path "$HOME\.vscode-R" -ErrorAction SilentlyContinue)) { Write-Error "FAIL: ~/.vscode-R missing"; exit 1 }

      - name: Verify setup - .Rprofile symlink
        shell: pwsh
        run: |
          $item = Get-Item "$HOME\.config\R\.Rprofile" -Force -ErrorAction SilentlyContinue
          if (-not $item)                               { Write-Error "FAIL: .Rprofile not found"; exit 1 }
          if ($item.LinkType -ne "SymbolicLink")        { Write-Error "FAIL: .Rprofile is not a symlink"; exit 1 }
          Write-Host "Symlink target: $($item.Target)"

      - name: Verify setup - environment variables
        shell: pwsh
        run: |
          if (-not [Environment]::GetEnvironmentVariable("R_LIBS_SITE",    "Machine")) { Write-Error "FAIL: R_LIBS_SITE not set (Machine)"; exit 1 }
          if (-not [Environment]::GetEnvironmentVariable("R_LIBS_USER",    "User"))    { Write-Error "FAIL: R_LIBS_USER not set (User)"; exit 1 }
          if (-not [Environment]::GetEnvironmentVariable("R_PROFILE_USER", "User"))    { Write-Error "FAIL: R_PROFILE_USER not set (User)"; exit 1 }

      - name: Run uninstall
        run: .\uninstall.ps1
        shell: pwsh

      - name: Verify uninstall - directories removed
        shell: pwsh
        run: |
          if (Test-Path "$HOME\.config\R")                          { Write-Error "FAIL: ~/.config/R still exists"; exit 1 }
          if (Test-Path "$HOME\.vscode-R" -ErrorAction SilentlyContinue) { Write-Error "FAIL: ~/.vscode-R still exists"; exit 1 }

      - name: Verify uninstall - environment variables cleared
        shell: pwsh
        run: |
          if ([Environment]::GetEnvironmentVariable("R_LIBS_SITE",    "Machine")) { Write-Error "FAIL: R_LIBS_SITE still set"; exit 1 }
          if ([Environment]::GetEnvironmentVariable("R_LIBS_USER",    "User"))    { Write-Error "FAIL: R_LIBS_USER still set"; exit 1 }
          if ([Environment]::GetEnvironmentVariable("R_PROFILE_USER", "User"))    { Write-Error "FAIL: R_PROFILE_USER still set"; exit 1 }
